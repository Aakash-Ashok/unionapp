services:
  - type: web
    name: unionapp
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate

    startCommand: gunicorn unionapp.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: unionapp.settings
      - key: PYTHON_VERSION
        value: 3.10
      - key: DATABASE_URL
        value: DATABASE_URL=postgresql://postgres:[YOUR-PASSWORD]@db.kvavhvqxjhgplbotugto.supabase.co:5432/postgres
  postDeployCommand: python manage.py migrate
